name: RooSync
options:
  bundleIdPrefix: com.rooindustries
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    GENERATE_INFOPLIST_FILE: NO
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: NO
targets:
  RooSync:
    type: application
    platform: iOS
    sources:
      - path: RooSync
    info:
      path: RooSync/Info.plist
      properties:
        CFBundleDisplayName: RooSync
        BGTaskSchedulerPermittedIdentifiers:
          - com.rooindustries.roosync.refresh
          - com.rooindustries.roosync.processing
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSCameraUsageDescription: RooSync uses the camera to scan Syncthing device IDs.
        NSLocalNetworkUsageDescription: RooSync connects to Syncthing devices on your local network.
        UIBackgroundModes:
          - fetch
          - processing
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        "UISupportedInterfaceOrientations~ipad":
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rooindustries.roosync
        PRODUCT_NAME: RooSync
        INFOPLIST_KEY_CFBundleDisplayName: RooSync
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: RooSync/RooSync.entitlements
        OTHER_LDFLAGS: "$(inherited) -lresolv"
    dependencies:
      - framework: Frameworks/RooSyncCore.xcframework
        embed: true
      - sdk: AppIntents.framework
    scheme:
      testTargets:
        - RooSyncUITests
  RooSyncUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: RooSyncUITests
    dependencies:
      - target: RooSync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rooindustries.roosync.uitests
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: RooSyncUITests
        INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsLocalNetworking: YES
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: RooSync UI tests access the local Syncthing REST API.
